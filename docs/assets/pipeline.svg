<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" style="background:#0d1117;border-radius:8px;font-family:Arial,sans-serif">
  <defs>
    <style>
      .box{rx:6;stroke-width:1.5;fill:#161b22}
      .title-text{fill:#f0f6fc;font-weight:600;font-size:13px}
      .sub-text{fill:#8b949e;font-size:11px}
      .pulse-dot{animation:pulse 3s infinite ease-in-out}
      @keyframes pulse{0%{r:4;opacity:.3}50%{r:6.5;opacity:1}100%{r:4;opacity:.3}}
      .flow-pulse{stroke-dasharray:8 8;animation:dash 1.5s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
    </style>
  </defs>

  <g stroke-width="2" fill="none">
    <path d="M160 130H240" stroke="#30363d"/>
    <path d="M160 130H240" stroke="#58a6ff" class="flow-pulse"/>
    <path d="M380 130H460" stroke="#30363d"/>
    <path d="M380 130H460" stroke="#bc8cff" class="flow-pulse"/>
    <path d="M600 130H680" stroke="#30363d"/>
    <path d="M600 130H680" stroke="#3fb950" class="flow-pulse"/>
  </g>

  <g transform="translate(20 80)">
    <rect class="box" width="140" height="100" stroke="#58a6ff"/>
    <circle class="pulse-dot" cx="20" cy="22" r="5" fill="#58a6ff"/>
    <text x="35" y="26" class="title-text">Stage 1: FP32</text>
    <text x="15" y="55" class="sub-text">Continuous Tensor</text>
    <text x="15" y="73" class="sub-text">Row-Major Buffer</text>
    <text x="15" y="90" class="sub-text">Naive GEMM Ops</text>
  </g>

  <g transform="translate(240 80)">
    <rect class="box" width="140" height="100" stroke="#bc8cff"/>
    <circle class="pulse-dot" cx="20" cy="22" r="5" fill="#bc8cff"/>
    <text x="35" y="26" class="title-text">Stage 2: Quantize</text>
    <text x="15" y="55" class="sub-text">Affine Mapping (S, Z)</text>
    <text x="15" y="73" class="sub-text">FP32 to INT8 Math</text>
    <text x="15" y="90" class="sub-text">32-bit Accumulator</text>
  </g>

  <g transform="translate(460 80)">
    <rect class="box" width="140" height="100" stroke="#3fb950"/>
    <circle class="pulse-dot" cx="20" cy="22" r="5" fill="#3fb950"/>
    <text x="35" y="26" class="title-text">Stage 3: RV32I</text>
    <text x="15" y="55" class="sub-text">Cycle Emulator</text>
    <text x="15" y="73" class="sub-text">Freestanding Binary</text>
    <text x="15" y="90" class="sub-text">RV32M Integer MUL</text>
  </g>

  <g transform="translate(680 80)">
    <rect class="box" width="145" height="100" stroke="#d29922"/>
    <circle class="pulse-dot" cx="20" cy="22" r="5" fill="#d29922"/>
    <text x="35" y="26" class="title-text">Stage 4: Profile</text>
    <text x="15" y="55" class="sub-text">Cycle Count Audit</text>
    <text x="15" y="73" class="sub-text">Memory Footprint</text>
    <text x="15" y="90" class="sub-text">Accuracy Divergence</text>
  </g>

  <text x="25" y="38" fill="#58a6ff" font-size="14" font-weight="700" letter-spacing="1.5">END-TO-END INFERENCE EXECUTION PIPELINE</text>
  <text x="25" y="54" fill="#8b949e" font-size="11">Deterministic Execution on Custom RISC-V Architecture</text>
</svg>
